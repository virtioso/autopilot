[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0",
    "pyserial-asyncio-fast>=0.12",
    "asyncssh>=2.14",
    "docker>=7.1.0",
    # zenoh>=1.0 — install separately if needed (not on PyPI for all platforms)
    "pydantic>=2.0",
    "libtmux>=0.28",
    "ptyprocess>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "adapters*", "model*"]
