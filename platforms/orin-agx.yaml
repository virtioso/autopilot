platform: orin-agx
description: "NVIDIA Orin AGX development board (seL4 / CAmkES / Isengard)"

defaults:
  # Physical UART connections
  tty0: /dev/ttyACM0     # CCPLEX console (raw/VCMux muxed)
  tty1: /dev/ttyACM1     # UARTI carrier (VCMux uplink)
  baudrate: 115200

  # Network
  target_ip: 192.168.1.100
  target_user: root

  # VCMux
  virtioso_mux_path: /home/hlyytine/tii-sel4/sources/virtioso-mux/host/virtioso-mux
  vcmux_outer_mode: raw

  # EFI deploy — board-level constants (same for every user on this board type)
  # local_efi_path is user-specific; set it in settings/local.yaml
  remote_efi_path: /efiboot/test.efi
  efi_binary: 'efiboot\test.efi'
  efi_fs: fs2

  # Timeouts (seconds)
  boot_timeout: 180
  elfloader_timeout: 300
  test_timeout: 420
